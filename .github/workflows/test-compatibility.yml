name: Test Plugin Compatibility

env:
  # Default versions to test (used on push/PR; can be overridden on manual dispatch)
  DEFAULT_VERSIONS: '1.20.1,26.2'

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      versions:
        description: 'Comma-separated MC versions to test (leave empty for the default list)'
        required: false
        default: '1.20.1,26.2'

jobs:
  # Split the version string into a matrix: manual runs use the input, push/PR use the default list
  prepare:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.split.outputs.versions }}
    steps:
      - name: Split versions input
        id: split
        run: |
          RAW="${{ github.event.inputs.versions }}"
          [ -z "$RAW" ] && RAW="$DEFAULT_VERSIONS"
          # Strip spaces and split on commas into a JSON array
          VERSIONS=$(echo "$RAW" | tr -d ' ' | tr ',' '\n' | jq -R . | jq -sc .)
          echo "Test versions: $VERSIONS"
          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT

  test:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        version: ${{ fromJson(needs.prepare.outputs.versions) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          # 21 for older versions; Paper 26.x and later requires Java 25
          java-version: |
            21
            25
          cache: gradle

      # gradlew may be stored as 100644 in git (exec bit lost on Windows commits); ./gradlew would exit 126
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build plugin
        run: |
          ./gradlew clean build -x test

          # Read the version from the Gradle project (plugin.yml holds a ${version} placeholder filled in by Gradle)
          PROPS=$(./gradlew -q properties)
          PLUGIN_VERSION=$(echo "$PROPS" | grep -oP '^version: \K.*' | head -n 1)
          echo "Gradle project version: $PLUGIN_VERSION"
          echo "PLUGIN_VERSION=$PLUGIN_VERSION" >> $GITHUB_ENV

      # Cache the Paper server (jar + vanilla libraries + patched output) per version to avoid re-downloading 40 MB+ every run
      - name: Cache Paper server
        uses: actions/cache@v4
        with:
          path: |
            server/paper.jar
            server/cache
            server/caches
            server/libraries
            server/versions
          key: paper-server-${{ matrix.version }}

      - name: Download dependencies
        run: |
          mkdir -p server/plugins

          # Dependency plugins
          # SFWorldEdit declares depend: [Slimefun]; Bukkit refuses to enable it without Slimefun
          # Use the SlimefunGuguProject build (matches the compile target of this repository)
          curl -L -o server/plugins/Slimefun4.jar \
            "https://resources.guizhanss.com/api/v1/projects/Slimefun4/versions/master-271/download"

          curl -L -o server/plugins/GuizhanLibPlugin.jar \
            "https://resources.guizhanss.com/api/v1/projects/GuizhanLibPlugin/versions/build-61/download"

      - name: Run Paper server and load plugin
        id: run-server
        run: |
          cp build/libs/*.jar server/plugins/

          VER="${{ matrix.version }}"

          # Check that the version exists first; if not, list "Did you mean" candidates and skip (not a failure)
          export VER
          RESOLVE=$(python3 << 'EOF' 2>&1
          import json, os, urllib.request

          ver = os.environ['VER']
          UA = {'User-Agent': 'SFWorldEdit-CI'}

          def fetch(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          data = fetch('https://fill.papermc.io/v3/projects/paper/versions')
          items = data['versions'] if isinstance(data, dict) else data
          ids = [v['version']['id'] for v in items]

          if ver in ids:
              print('EXISTS')
              # Read the minimum Java version so the right JDK can be selected later
              entry = next(v for v in items if v['version']['id'] == ver)
              minimum = entry['version'].get('java', {}).get('version', {}).get('minimum', 21)
              print(f'MINJAVA={minimum}')
          else:
              # Prefix match: input 26.1 suggests 26.1.1 / 26.1.2
              near = sorted(i for i in ids if i.startswith(ver + '.'))
              if near:
                  print('SUGGEST=' + ', '.join(near))
              else:
                  print('NO_SUGGEST')
          EOF
          ) || {
            echo "::error::Failed to check Paper $VER: $RESOLVE"
            exit 1
          }

          case "$RESOLVE" in
            EXISTS*)
              : # Version exists, continue
              ;;
            SUGGEST=*)
              echo "::notice::Paper $VER does not exist. Did you mean: ${RESOLVE#SUGGEST=}"
              exit 0
              ;;
            *)
              echo "::error::Paper $VER does not exist and no similar version starts with it; cannot test"
              exit 1
              ;;
          esac

          # Pick the JDK from the minimum Java version reported by the API (this workflow installs 21 and 25)
          MINJAVA=$(echo "$RESOLVE" | grep -oP 'MINJAVA=\K\d+' | head -n 1)
          MINJAVA=${MINJAVA:-21}
          echo "Paper $VER requires at least Java $MINJAVA"
          if [ "$MINJAVA" -gt 25 ]; then
            echo "::error::Paper $VER needs Java $MINJAVA, which is not installed by this workflow (21/25); add it to setup-java"
            exit 1
          elif [ "$MINJAVA" -gt 21 ]; then
            if [ -n "$JAVA_HOME_25_X64" ]; then
              export JAVA_HOME="$JAVA_HOME_25_X64"
              export PATH="$JAVA_HOME/bin:$PATH"
              echo "Using Java 25 for Paper $VER: $(java -version 2>&1 | head -n 1)"
            else
              echo "::warning::JAVA_HOME_25_X64 not found, Paper $VER may fail to start"
            fi
          fi

          # Fetch every build of this version and resolve the download URL of the latest one
          # Parse with Python for clear errors (on failure the API returns an error object that jq reports cryptically)
          curl -s -H "User-Agent: SFWorldEdit-CI (github.com/balugaq/SFWorldEdit)" \
            "https://fill.papermc.io/v3/projects/paper/versions/$VER/builds" -o builds.json
          RESULT=$(python3 << 'EOF' 2>&1
          import json

          with open('builds.json') as f:
              data = json.load(f)

          if isinstance(data, dict):
              raise SystemExit(f'API returned an error object: {json.dumps(data)[:300]}')
          if not isinstance(data, list) or not data:
              raise SystemExit('The builds list is empty')

          latest = max(data, key=lambda b: b.get('id', 0))
          url = (latest.get('downloads') or {}).get('server:default', {}).get('url')
          if not url:
              raise SystemExit(f"build {latest.get('id')} has no download URL: {json.dumps(latest)[:300]}")
          print(f'URL={url}')
          EOF
          ) || {
            echo "::error::Paper $VER: $RESULT"
            exit 1
          }
          DOWNLOAD_URL=$(echo "$RESULT" | grep -oP 'URL=\K.*')
          echo "Downloading Paper $VER: $DOWNLOAD_URL"
          curl -L -o server/paper.jar "$DOWNLOAD_URL"

          # Accept the EULA and write a minimal server configuration
          echo "eula=true" > server/eula.txt
          echo "online-mode=false" > server/server.properties
          echo "level-type=flat" >> server/server.properties
          echo "generate-structures=false" >> server/server.properties

          # Start the server; a background watcher sends "stop" once console.log shows "Done (" (startup finished).
          # The outer timeout 600 is a safety net (the first paperclip start unpacks the vanilla jar and libraries, which is slow)
          cd server
          rm -f in.fifo
          mkfifo in.fifo
          ( for i in $(seq 1 110); do grep -q 'Done (' console.log 2>/dev/null && break; sleep 5; done; sleep 5; echo stop > in.fifo ) &
          MON_PID=$!
          timeout 600 java -Xmx2G -jar paper.jar nogui < in.fifo > console.log 2>&1 || true
          kill $MON_PID 2>/dev/null || true
          rm -f in.fifo
          cd ..

          # Print the whole server console log into the job log for easy reading
          echo "======== server console.log ========"
          cat server/console.log || true
          echo "======== end of console.log ========"

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log-${{ matrix.version }}
          path: server/console.log
          if-no-files-found: warn

      - name: Check server logs
        run: |
          LOG_FILE=server/console.log
          if [ ! -f "$LOG_FILE" ]; then
            echo "::error::Log file not found; the server probably never started"
            exit 1
          fi

          # Read the plugin name/version from plugin.yml inside the built jar, in case the project name differs from the Bukkit plugin name;
          # the ${version} placeholder in plugin.yml was already replaced by processResources
          JAR=$(ls build/libs/*.jar | head -n 1)
          PLUGIN_NAME=$(unzip -p "$JAR" plugin.yml | grep -oP '^name: *\K.*' | head -n 1)
          PLUGIN_VERSION=$(unzip -p "$JAR" plugin.yml | grep -oP '^version: *\K.*' | head -n 1)
          echo "Testing plugin: $PLUGIN_NAME v$PLUGIN_VERSION"

          # Use "Done (x.xxs)!" as the boundary: a Disabling line before Done means the plugin failed during startup
          DONE_LINE=$(grep -n 'Done (' "$LOG_FILE" | head -n 1 | cut -d: -f1)
          if [ -z "$DONE_LINE" ]; then
            echo "::error::The server did not finish starting on MC ${{ matrix.version }} (no Done line)"
            exit 1
          fi

          DISABLE_LINE=$(grep -n "\[${PLUGIN_NAME}\] Disabling ${PLUGIN_NAME}" "$LOG_FILE" | head -n 1 | cut -d: -f1)
          if [ -n "$DISABLE_LINE" ] && [ "$DISABLE_LINE" -lt "$DONE_LINE" ]; then
            echo "::error::The plugin was disabled during startup on MC ${{ matrix.version }} (Disabling before Done)"
            grep -n "Disabling ${PLUGIN_NAME}" "$LOG_FILE"
            exit 1
          fi

          # No Enabling line means the plugin never loaded (crash or missing dependency)
          if ! grep -q "Enabling ${PLUGIN_NAME}" "$LOG_FILE"; then
            echo "::error::The plugin was not enabled on MC ${{ matrix.version }} (no Enabling line)"
            exit 1
          fi

          echo "✅ OK: the plugin enabled correctly on MC ${{ matrix.version }}"
