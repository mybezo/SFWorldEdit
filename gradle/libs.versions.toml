# Gradle Version Catalog
# All dependencies are declared here and referenced as `libs.xxx` in build.gradle.kts.
# Aliases are kebab-case; the Kotlin DSL maps them to dotted accessors (e.g. `paper-api` -> `libs.paper.api`).

[versions]
# Core (old pom.xml values: spigot-api 1.21-R0.1-SNAPSHOT; Slimefun4 b39097e015 now returns 404 on JitPack)
paper-api = "1.21.11-R0.1-SNAPSHOT"
slimefun4 = "2025.1"

# Tools (old pom.xml values: bstats 3.0.2, findbugs 3.0.1u2, lombok 1.18.34, GuizhanLibPlugin 1.7.6)
bstats = "3.2.1"
findbugs-annotations = "3.0.1u2"
lombok = "1.18.48"
guizhan-lib-plugin = "2.5.0"

# Plugins
shadow = "9.6.1"

[libraries]
# Core
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
slimefun4 = { module = "com.github.SlimefunGuguProject:Slimefun4", version.ref = "slimefun4" }

# Tools
bstats = { module = "org.bstats:bstats-bukkit", version.ref = "bstats" }
findbugs-annotations = { module = "com.google.code.findbugs:annotations", version.ref = "findbugs-annotations" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
# Published on Maven Central, not JitPack / CodeMC
guizhan-lib-plugin = { module = "net.guizhanss:GuizhanLibPlugin", version.ref = "guizhan-lib-plugin" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }

# Note: org.metamechanists:MetaLib:46 and DisplayModelLib:3 from the old pom.xml live on
# repo.metamechanists.org, which now returns 404 for everything. They cannot be resolved by
# coordinates, so they are provided by lib/*.jar (implementation(fileTree(...)) in build.gradle.kts)
# and are not listed in this catalog.
